name: Diagnose Tongtian rendered table

on:
  push:
    branches: [fix-remaining-thirty-252-20260910]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      HE_NETWORK_POLICY: strict
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[browser,test]"
      - name: Render and inspect tables
        shell: pwsh
        run: |
          @'
          import json,re
          from bs4 import BeautifulSoup
          from pathlib import Path
          from he_app.config.sites import load_sites
          from he_app.fetch.browser import BrowserClient,close_browser_safely
          data=json.loads(Path('sites.json').read_text(encoding='utf-8'))
          Path('one.json').write_text(json.dumps([x for x in data if x['id']=='s058_vkjwinyt'],ensure_ascii=False),encoding='utf-8')
          site=load_sites(Path('one.json'))[0]
          b=BrowserClient(headless=True); b.start()
          try:
              docs=b.get_documents(site.url,252,False,45)
          finally:
              close_browser_safely(b)
          print('DOCS',len(docs))
          for di,doc in enumerate(docs):
              soup=BeautifulSoup(str(doc),'html.parser')
              print('TABLES',len(soup.find_all('table')))
              for ti,t in enumerate(soup.find_all('table')):
                  text=re.sub(r'\s+',' ',t.get_text(' ',strip=True))
                  if '杀合' in text or '殺合' in text or '综合杀' in text or '綜合殺' in text or '综合' in text:
                      print(f'---TABLE {ti}---')
                      print(text[:5000])
                      for ri,row in enumerate(t.find_all('tr')):
                          cells=[re.sub(r'\s+',' ',c.get_text(' ',strip=True)) for c in row.find_all(['th','td'],recursive=False)]
                          if cells:
                              print('ROW',ri,repr(cells))
              full=re.sub(r'\s+',' ',soup.get_text(' ',strip=True))
              for pat in ['澳门综合杀','綜合殺','综合杀','杀合','殺合']:
                  start=0
                  while True:
                      i=full.find(pat,start)
                      if i<0: break
                      print('AROUND',pat,full[max(0,i-500):i+1500])
                      start=i+len(pat)
          '@ | python -
