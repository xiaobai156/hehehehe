name: Debug 252 strict next-edge policy

on:
  push:
    branches:
      - fix/next-period-edge-20260909
    paths:
      - .github/workflows/debug-next-edge-252.yml

permissions:
  contents: read

jobs:
  production:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: strict
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Run 252 production with strict 253 edge fallback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force edge-check | Out-Null
          python he_crawler.py `
            --period 252 `
            --workers 8 `
            --timeout 20 `
            --hard-timeout 90 `
            --browser-hard-timeout 130 `
            --success edge-check/252-success.txt `
            --fail edge-check/252-fail.txt `
            --no-fingerprint-cache-sync
      - name: Count exact result lines
        shell: pwsh
        run: |
          $successCount = 0
          if (Test-Path edge-check/252-success.txt) {
            $lines = Get-Content edge-check/252-success.txt -Encoding UTF8
            foreach ($line in $lines) {
              if ($line -eq '内容`t次数`t排名' -or $line -eq '当前合数排行') { break }
              if ($line -match '^(?:0[1-9]|1[0-3])合(?:,(?:0[1-9]|1[0-3])合)*\s+\S') { $successCount++ }
            }
          }
          Write-Host "strict_edge_success=$successCount strict_edge_failed=$((125-$successCount))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-next-edge-252
          path: edge-check
          if-no-files-found: warn
          retention-days: 7
