name: Finalize all production completion work

on:
  push:
    branches:
      - fix/production-completion-20260909
    paths:
      - .github/workflows/finalize-production-v4.yml

permissions:
  contents: write

concurrency:
  group: production-completion-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile latest main before validation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply any still-pending idempotent source patches
        shell: pwsh
        run: |
          if (Test-Path tools/apply_completion_integration.py) {
            python tools/apply_completion_integration.py
          }
          if (Test-Path tools/apply_history_completion.py) {
            python tools/apply_history_completion.py
          }
      - name: Assert all four implementations exist
        shell: pwsh
        run: |
          $required = @(
            'he_app/domain/periods.py',
            'he_app/fetch/network_policy.py',
            'he_app/runtime/process_jobs.py',
            'he_app/services/cycle_fingerprint.py',
            'he_app/services/live_validation.py',
            'he_app/services/cycle_duplicate_check.py',
            'he_app/services/hard_runner.py',
            'he_app/storage/cycle_cache.py',
            'he_live_validator.py'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required implementation: $path" }
          }
          if (-not (Select-String -Path he_crawler.py -Pattern 'hard_runner' -Quiet)) {
            throw 'Single-period production entry is not hard-isolated.'
          }
          if (-not (Select-String -Path he_duplicate_checker.py -Pattern 'cycle_duplicate_check' -Quiet)) {
            throw 'Duplicate checker is not cycle-aware.'
          }
      - name: Install verified dependencies
        run: python -m pip install -e ".[browser,test]"
      - name: Auto-fix safe lint findings and verify code
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m ruff check . --fix
          python -m ruff check .
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -c "import he_crawler, he_multi_period_crawler, he_duplicate_checker, he_live_validator"
          python he_crawler.py --help
          python he_duplicate_checker.py --help
          python he_live_validator.py --help
      - name: Full offline regression suite
        env:
          HE_NETWORK_POLICY: "off"
        run: python -m pytest -q -m "not browser"
      - name: Resolve current Tokyo cycle and period
        id: target
        shell: pwsh
        run: |
          $json = python -c "from datetime import datetime; from zoneinfo import ZoneInfo; import json; n=datetime.now(ZoneInfo('Asia/Tokyo')); print(json.dumps({'cycle':n.year,'period':n.timetuple().tm_yday}))"
          $target = $json | ConvertFrom-Json
          "cycle=$($target.cycle)" >> $env:GITHUB_OUTPUT
          "period=$($target.period)" >> $env:GITHUB_OUTPUT
          Write-Host "cycle=$($target.cycle) period=$($target.period)"
      - name: Strict live validation of all configured sites
        env:
          HE_NETWORK_POLICY: "strict"
        shell: pwsh
        run: |
          python he_live_validator.py `
            --cycle '${{ steps.target.outputs.cycle }}' `
            --period '${{ steps.target.outputs.period }}' `
            --periods 10 `
            --workers 8 `
            --timeout 20 `
            --hard-timeout 150 `
            --output-dir live-validation-final
      - name: Require complete site accounting and write final status
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('live-validation-final/live-validation.json').read_text(encoding='utf-8'))
          assert report['site_count'] == 125, report['site_count']
          assert report['attempted_count'] == report['site_count'], (report['attempted_count'], report['site_count'])
          assert len(report['results']) == report['site_count']
          ids = [item['site_id'] for item in report['results']]
          assert len(set(ids)) == len(ids) == report['site_count']
          assert all(item['attempted'] for item in report['results'])

          categories = ', '.join(f"{key}={value}" for key, value in sorted(report['categories'].items()))
          status = f"""# 生产补全状态

          - GitHub Actions 运行：`{os.environ['GITHUB_RUN_ID']}`
          - 验收提交：`{os.environ['GITHUB_SHA']}`
          - 目标周期/期数：`{report['period_key']}`
          - 配置站点：`{report['site_count']}`
          - 已真实尝试：`{report['attempted_count']}`
          - 当期严格验证成功：`{report['current_success_count']}`
          - 具备完整 {report['history_required']} 期历史：`{report['history_complete_count']}`
          - 硬超时：`{report['hard_timeout_count']}`
          - 分类：`{categories}`

          四项工程工作已经落地并经过本次完整门禁：全部配置站点逐一真实尝试；历史仅从已验证记录或逐期独立验证文章提取；判重使用显式周期身份；DNS、TLS、浏览器启动、页面读取和解析均位于可终止子进程硬期限内。

          外部站点不可达、TLS 失败、指定期尚未发布或网站本身没有足够历史，不得伪造成成功。完整逐站结果和网络/来源证据保存在本次 Actions 的 `full-production-live-validation-final` 工件中。
          """
          Path('PRODUCTION_COMPLETION_STATUS.md').write_text(status, encoding='utf-8')
          '@ | Set-Content write_final_status.py -Encoding UTF8
          python write_final_status.py
          Remove-Item write_final_status.py
      - name: Upload immutable final live evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-production-live-validation-final
          path: live-validation-final
          if-no-files-found: error
          retention-days: 30
      - name: Remove generated reports and one-shot tooling
        shell: pwsh
        run: |
          $paths = @(
            '.github/workflows/export-source.yml',
            '.github/workflows/baseline-live.yml',
            '.github/workflows/apply-completion-integration.yml',
            '.github/workflows/complete-production-v2.yml',
            '.github/workflows/complete-history-v2.yml',
            '.github/workflows/complete-production-v3.yml',
            '.github/workflows/finalize-production-v4.yml',
            'tools/apply_completion_integration.py',
            'tools/apply_history_completion.py',
            'live-validation-final'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
      - name: Final clean-tree verification
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m ruff check .
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -m pytest -q tests/test_period_cycles.py tests/test_cycle_cache.py tests/test_network_policy.py tests/test_process_isolation.py tests/test_completion_coverage.py
          git diff --check
      - name: Commit and publish only verified tree
        shell: pwsh
        run: |
          git add --all
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: complete all-site validation, history, cycles and hard isolation'
          }
          git push origin HEAD:fix/production-completion-20260909
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:main
