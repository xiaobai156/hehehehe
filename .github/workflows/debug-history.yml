name: Debug incomplete history

on:
  push:
    branches:
      - fix/production-completion-20260909
    paths:
      - .github/workflows/debug-history.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[browser,test]'
      - name: Capture final documents for history-incomplete sites
        shell: bash
        run: |
          cat > /tmp/capture_history.py <<'PY'
          import json
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          from he_app.config.sites import load_sites
          from he_app.domain.periods import PeriodKey
          from he_app.fetch.browser import BrowserPool
          from he_app.fetch.discovery import collect_documents
          from he_app.fetch.http import build_host_locks, create_session
          from he_app.parsers.dedicated.tables import site_rule
          from he_app.services.document_sources import collect_special_site_documents, requires_browser
          from he_app.services.fingerprint import build_site_period_fingerprint
          from he_app.services.single_period import parse_site_period

          TARGET_IDS = {
              's015_topic_206515', 's024_topic_350541', 's026_topic_504960',
              's031_topic_437742', 's034_topic_322671', 's035_topic_417590',
              's038_topic_455540', 's039_topic_455521', 's040_topic_287375',
              's042_topic_439183', 's044_topic_445676', 's050_topic_680730',
              's052_topic_206523', 's056_topic_220982', 's067_topic_680695',
              's077_topic_233118', 's083_topic_242261', 's085_kcvpleh',
              's093_a_909922_article_aspx_id_3694545', 's133_ttss_79_chenyuan',
              's134_ttss_79_qifeng',
          }
          base = PeriodKey(2026, 252)
          all_sites = load_sites(Path('sites.json'))
          sites = [site for site in all_sites if site.site_id in TARGET_IDS]
          host_locks = build_host_locks(sites, {})
          output = Path('history-debug')
          output.mkdir(parents=True, exist_ok=True)
          pool_size = min(3, sum(requires_browser(site) for site in sites))
          browser_pool = BrowserPool(pool_size, headless=True) if pool_size else None
          if browser_pool:
              browser_pool.start()

          def load_documents(site, browser=None):
              with create_session(host_locks) as session:
                  documents = collect_special_site_documents(session, site, 20, base.issue)
                  if documents is not None:
                      return documents
                  if requires_browser(site):
                      if browser is None:
                          raise RuntimeError('browser required')
                      return browser.get_documents(site.url, base.issue, site.click_first, 20)
                  return collect_documents(
                      session,
                      site.url,
                      20,
                      allow_inline_decode='http-decoded' in site_rule(site).allowed_fetch_kinds,
                  )

          def capture(site):
              started = time.monotonic()
              try:
                  if requires_browser(site):
                      documents = browser_pool.run(lambda browser: load_documents(site, browser))
                  else:
                      documents = load_documents(site)
                  parsed = parse_site_period(site, base.issue, documents)
                  fingerprint = build_site_period_fingerprint(site, documents, base, 10)
                  meta = {
                      'site_id': site.site_id,
                      'name': site.name,
                      'url': site.url,
                      'pick': site.pick,
                      'document_count': len(documents),
                      'parse_success': parsed.success,
                      'parse_value': parsed.value,
                      'parse_failure': (
                          {'category': parsed.failure.category, 'reason': parsed.failure.reason}
                          if parsed.failure else None
                      ),
                      'fingerprint': {key.cache_key: value for key, value in fingerprint.items()},
                      'elapsed_seconds': round(time.monotonic() - started, 3),
                      'documents': [],
                  }
                  site_dir = output / site.site_id
                  site_dir.mkdir(parents=True, exist_ok=True)
                  for index, document in enumerate(documents):
                      text = str(document)
                      if len(text) > 1_000_000:
                          text = text[:500_000] + '\n\n[TRUNCATED]\n\n' + text[-500_000:]
                      suffix = '.html' if str(getattr(document, 'document_type', '')).lower() in {'html', 'page-source'} else '.txt'
                      filename = f'document-{index:02d}{suffix}'
                      (site_dir / filename).write_text(text, encoding='utf-8')
                      meta['documents'].append({
                          'file': filename,
                          'length': len(str(document)),
                          'source_url': str(getattr(document, 'source_url', '')),
                          'fetch_kind': str(getattr(document, 'fetch_kind', '')),
                          'document_type': str(getattr(document, 'document_type', '')),
                          'authority_id': str(getattr(document, 'authority_id', '')),
                          'document_id': str(getattr(document, 'document_id', '')),
                          'record_id': getattr(document, 'record_id', None),
                      })
                  (site_dir / 'metadata.json').write_text(
                      json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
                  )
                  return site.site_id, 'ok', meta['elapsed_seconds']
              except BaseException as exc:
                  site_dir = output / site.site_id
                  site_dir.mkdir(parents=True, exist_ok=True)
                  error = {
                      'site_id': site.site_id,
                      'name': site.name,
                      'url': site.url,
                      'error': f'{type(exc).__name__}: {exc}',
                      'elapsed_seconds': round(time.monotonic() - started, 3),
                  }
                  (site_dir / 'metadata.json').write_text(
                      json.dumps(error, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
                  )
                  return site.site_id, 'failed', error['elapsed_seconds']

          try:
              http_sites = [site for site in sites if not requires_browser(site)]
              browser_sites = [site for site in sites if requires_browser(site)]
              results = []
              with ThreadPoolExecutor(max_workers=max(1, min(4, len(http_sites)))) as executor:
                  futures = [executor.submit(capture, site) for site in http_sites]
                  for future in as_completed(futures):
                      result = future.result()
                      results.append(result)
                      print(result, flush=True)
              with ThreadPoolExecutor(max_workers=max(1, pool_size)) as executor:
                  futures = [executor.submit(capture, site) for site in browser_sites]
                  for future in as_completed(futures):
                      result = future.result()
                      results.append(result)
                      print(result, flush=True)
              (output / 'index.json').write_text(
                  json.dumps(sorted(results), ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )
          finally:
              if browser_pool:
                  browser_pool.close()
          PY
          python /tmp/capture_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-debug
          path: history-debug
          if-no-files-found: error
          retention-days: 3
