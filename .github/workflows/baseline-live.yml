name: Live validation

on:
  push:
    branches:
      - fix/production-completion-20260909
    paths:
      - he_app/**
      - he_live_audit.py
      - sites.json
      - .github/workflows/baseline-live.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[browser,test]'
      - name: Resolve Tokyo period
        id: period
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          current = datetime.now(ZoneInfo("Asia/Tokyo"))
          print(f"cycle_year={current.year}")
          print(f"period={current.timetuple().tm_yday}")
          PY
      - name: Validate all configured sites without production writes
        shell: bash
        run: |
          python he_live_audit.py \
            --cycle-year '${{ steps.period.outputs.cycle_year }}' \
            --period '${{ steps.period.outputs.period }}' \
            --periods 10 \
            --minimum-history 6 \
            --workers 12 \
            --timeout 15 \
            --hard-timeout 45 \
            --browser-hard-timeout 90 \
            --output-dir live-validation
      - name: Add summary
        if: always()
        shell: bash
        run: |
          if [ -f live-validation/summary.txt ]; then
            cat live-validation/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-validation
          path: live-validation
          if-no-files-found: error
          retention-days: 7
