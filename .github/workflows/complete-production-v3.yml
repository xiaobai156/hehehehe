name: Complete production v3

on:
  push:
    branches:
      - fix/production-completion-20260909
    paths:
      - .github/workflows/complete-production-v3.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: windows-latest
    timeout-minutes: 125
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply all pending idempotent integrations
        shell: pwsh
        run: |
          if (Test-Path tools/apply_completion_integration.py) {
            python tools/apply_completion_integration.py
          }
          if (Test-Path tools/apply_history_completion.py) {
            python tools/apply_history_completion.py
          }
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Safe automatic lint cleanup
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m ruff check . --fix
          python -m ruff check .
      - name: Compile and import production commands
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -c "import he_crawler, he_multi_period_crawler, he_duplicate_checker, he_live_validator"
          python he_crawler.py --help
          python he_duplicate_checker.py --help
          python he_live_validator.py --help
      - name: Complete offline regression suite
        env:
          HE_NETWORK_POLICY: "off"
        run: python -m pytest -q -m "not browser"
      - name: Commit source before live validation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: integrate cycle model, verified history and hard isolation'
            git push origin HEAD:fix/production-completion-20260909
          }
      - name: Resolve Tokyo target
        id: target
        shell: pwsh
        run: |
          $json = python -c "from datetime import datetime; from zoneinfo import ZoneInfo; import json; n=datetime.now(ZoneInfo('Asia/Tokyo')); print(json.dumps({'cycle':n.year,'period':n.timetuple().tm_yday}))"
          $target = $json | ConvertFrom-Json
          "cycle=$($target.cycle)" >> $env:GITHUB_OUTPUT
          "period=$($target.period)" >> $env:GITHUB_OUTPUT
          Write-Host "cycle=$($target.cycle) period=$($target.period)"
      - name: Strict real validation for every configured site
        env:
          HE_NETWORK_POLICY: "strict"
        shell: pwsh
        run: |
          python he_live_validator.py `
            --cycle '${{ steps.target.outputs.cycle }}' `
            --period '${{ steps.target.outputs.period }}' `
            --periods 10 `
            --workers 8 `
            --timeout 20 `
            --hard-timeout 150 `
            --output-dir live-validation-v3
      - name: Assert complete accounting and write status
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path
          path = Path('live-validation-v3/live-validation.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['site_count'] == 125, report['site_count']
          assert report['attempted_count'] == 125, report['attempted_count']
          assert len(report['results']) == 125
          assert len({item['site_id'] for item in report['results']}) == 125
          categories = ', '.join(f"{key}={value}" for key, value in sorted(report['categories'].items()))
          status = f"""# 生产补全状态

          - GitHub Actions 运行：`{os.environ['GITHUB_RUN_ID']}`
          - 目标周期/期数：`{report['period_key']}`
          - 配置站点：`{report['site_count']}`
          - 已真实尝试：`{report['attempted_count']}`
          - 当期严格验证成功：`{report['current_success_count']}`
          - 具备完整 {report['history_required']} 期历史：`{report['history_complete_count']}`
          - 硬超时：`{report['hard_timeout_count']}`
          - 分类：`{categories}`

          本轮逐站实际访问了全部配置站点。静态历史页在已验证记录内提取历史；TTSS、动态主页/栏目和列表文章在不足时按周期窗口逐期查找，并对每篇文章单独验证。外部不可达、TLS 错误、未发布或历史不足保持真实状态，详细证据位于本次 Actions 的 `full-production-live-validation-v3` 工件。
          """
          Path('PRODUCTION_COMPLETION_STATUS.md').write_text(status, encoding='utf-8')
          '@ | Set-Content write_status.py -Encoding UTF8
          python write_status.py
          Remove-Item write_status.py
      - name: Upload immutable full-site evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-production-live-validation-v3
          path: live-validation-v3
          if-no-files-found: error
          retention-days: 30
      - name: Remove generated and one-shot tooling
        shell: pwsh
        run: |
          $paths = @(
            '.github/workflows/export-source.yml',
            '.github/workflows/baseline-live.yml',
            '.github/workflows/apply-completion-integration.yml',
            '.github/workflows/complete-production-v2.yml',
            '.github/workflows/complete-history-v2.yml',
            '.github/workflows/complete-production-v3.yml',
            'tools/apply_completion_integration.py',
            'tools/apply_history_completion.py',
            'live-validation-v3'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
      - name: Final repository verification
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m ruff check .
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -m pytest -q tests/test_period_cycles.py tests/test_cycle_cache.py tests/test_network_policy.py tests/test_process_isolation.py tests/test_completion_coverage.py
          git diff --check
      - name: Publish final verified tree
        shell: pwsh
        run: |
          git add --all
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: finish all-site production validation and cross-cycle support'
          }
          git push origin HEAD:fix/production-completion-20260909
          git push origin HEAD:main
