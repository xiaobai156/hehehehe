name: Debug browser render three

on:
  push:
    branches:
      - fix/final-five-252-20260909
    paths:
      - .github/workflows/debug-browser-render-three.yml

permissions:
  contents: read

jobs:
  site:
    strategy:
      fail-fast: false
      matrix:
        site_id:
          - s051_topic_702074
          - s065_topic_437721
          - s108_topic_1024380
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: strict
      HE_MAX_RESPONSE_BYTES: "8388608"
      TARGET_SITE_ID: ${{ matrix.site_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[browser,test]"
      - name: Render and strict-parse
        shell: pwsh
        run: |
          @'
          import json, os, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          from he_app.config.sites import load_sites
          from he_app.fetch.browser import BrowserClient
          from he_app.services.single_period import parse_site_period

          target = os.environ["TARGET_SITE_ID"]
          sites = load_sites(Path("sites.json"))
          site = next(item for item in sites if item.site_id == target)
          browser = BrowserClient(headless=True)
          browser.start()
          try:
              if target == "s108_topic_1024380":
                  browser.driver.set_page_load_timeout(20)
                  browser.driver.get(site.url)
                  browser.wait_for_document(5)
                  body = browser.driver.find_element("tag name", "body").text or ""
                  print("BODY_LEN", len(body))
                  print("BODY", re.sub(r"\s+", " ", body)[:4000])
                  links=[]
                  for a in browser.driver.find_elements("css selector", "a[href]"):
                      text=(a.text or "").strip()
                      href=a.get_attribute("href")
                      if any(k in text for k in ("252", "253", "命中", "绝杀")):
                          links.append((text,href))
                  for item in links[:100]: print("LINK", item)
                  # Strictly try the requested period and then immediate next using BrowserClient's unique-link rule.
                  for p in (252,253):
                      browser.driver.get(site.url); browser.wait_for_document(5)
                      try:
                          clicked=browser.try_click_best_post(p)
                          print("CLICK",p,clicked,browser.driver.current_url)
                          if clicked:
                              browser.wait_for_document(4)
                              docs=browser.collect_documents(site.url)
                              for doc in docs:
                                  parsed=parse_site_period(site,p,[doc])
                                  print("PARSE",p,doc.document_type,parsed.success,parsed.value,parsed.failure)
                      except Exception as exc:
                          print("CLICK_ERROR",p,type(exc).__name__,str(exc)[:1000])
              else:
                  docs=browser.get_documents(site.url,252,False,20)
                  print("DOCS",len(docs))
                  for doc in docs:
                      text=BeautifulSoup(str(doc),"html.parser").get_text(" ",strip=True) or str(doc)
                      print("TEXT",doc.document_type,re.sub(r"\s+"," ",text)[:6000])
                      for p in (252,253):
                          parsed=parse_site_period(site,p,[doc])
                          print("PARSE",p,parsed.success,parsed.value,parsed.failure)
          finally:
              browser.close()
          '@ | Set-Content render.py -Encoding UTF8
          python render.py
