name: Final remaining30 production gate

on:
  push:
    branches: [fix-remaining-thirty-252-20260910]

permissions:
  contents: read

jobs:
  production:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HE_NETWORK_POLICY: strict
      HE_MAX_RESPONSE_BYTES: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Build exact thirty-site config
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          names = {
              '电子排版','朝三暮四','达罗环宇','无適无莫','阳光明媚','错过中原','踏雪无痕网',
              '伤心人家','残丝断魂','作舍道旁','稳打稳中','通天','春风化雨','兴高采烈','叹为观止',
              '追根查源','嫦娥奔月','东益散人','没名字一','丰墙硗下','怒气冲冲','挂牌','没名字五',
              '和风细雨','新人旧梦','流浪高手','雷锋第一版','没名字二','号令如山','亡羊补牢'
          }
          data=json.loads(Path('sites.json').read_text(encoding='utf-8'))
          subset=[item for item in data if item['name'] in names]
          actual={item['name'] for item in subset}
          if len(subset)!=30 or actual!=names:
              raise SystemExit(f'subset mismatch count={len(subset)} missing={sorted(names-actual)}')
          Path('remaining30.json').write_text(json.dumps(subset,ensure_ascii=False,indent=2),encoding='utf-8')
          '@ | python -
      - name: Run real production entry point
        shell: pwsh
        run: |
          python he_crawler.py `
            --period 252 `
            --sites remaining30.json `
            --workers 8 `
            --timeout 30 `
            --hard-timeout 120 `
            --browser-hard-timeout 160 `
            --success remaining30-success.txt `
            --fail remaining30-fail.txt `
            --no-fingerprint-cache-sync
      - name: Require exact 30 of 30 site successes
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path
          success=Path('remaining30-success.txt').read_text(encoding='utf-8-sig')
          main=success.split('当前合数排行',1)[0]
          lines=[line.strip() for line in main.splitlines() if line.strip()]
          site_lines=[line for line in lines if re.match(r'^(?:0[1-9]|1[0-3])合(?:,(?:0[1-9]|1[0-3])合)*\s+\S',line)]
          print('STRICT_SITE_SUCCESSES=',len(site_lines))
          for line in site_lines: print('OK',line)
          fail_path=Path('remaining30-fail.txt')
          if fail_path.exists():
              fail=fail_path.read_text(encoding='utf-8-sig').strip()
              if fail:
                  print('FAIL_FILE_START')
                  print(fail)
                  print('FAIL_FILE_END')
          if len(site_lines)!=30:
              raise SystemExit(f'expected 30 strict site successes, got {len(site_lines)}')
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining30-production-result
          path: |
            remaining30-success.txt
            remaining30-fail.txt
          retention-days: 3
