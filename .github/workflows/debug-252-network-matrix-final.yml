name: Debug 252 final network matrix

on:
  push:
    branches:
      - debug/252-network-matrix-final-20260909
    paths:
      - .github/workflows/debug-252-network-matrix-final.yml

permissions:
  contents: read

jobs:
  site:
    strategy:
      fail-fast: false
      matrix:
        site_id:
          - s034_topic_322671
          - s052_topic_206523
          - s116_topic_440127
          - s118_topic_1024655
          - s119_topic_1024654
          - s126_topic_930870
          - s115_topic_440075
          - s129_topic_732154
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: "strict"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Build one-site config
        shell: pwsh
        env:
          TARGET_SITE_ID: ${{ matrix.site_id }}
        run: |
          @'
          import json, os
          target = os.environ["TARGET_SITE_ID"]
          sites = json.load(open("sites.json", encoding="utf-8-sig"))
          subset = [item for item in sites if item["id"] == target]
          assert len(subset) == 1, target
          json.dump(subset, open("one-site.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          '@ | Set-Content one_site.py -Encoding UTF8
          python one_site.py
      - name: Run production one site
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force result | Out-Null
          python he_crawler.py `
            --period 252 `
            --sites one-site.json `
            --workers 1 `
            --timeout 20 `
            --hard-timeout 90 `
            --browser-hard-timeout 130 `
            --success result/success.txt `
            --fail result/fail.txt `
            --no-fingerprint-cache-sync
      - name: Print result
        if: always()
        shell: pwsh
        run: |
          if (Test-Path result/success.txt) { Get-Content result/success.txt -Encoding UTF8 }
          if (Test-Path result/fail.txt) { Get-Content result/fail.txt -Encoding UTF8 }
