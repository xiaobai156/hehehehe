name: Final publish of all production completion work

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-publish-production.yml

permissions:
  contents: write

concurrency:
  group: production-completion-finalizer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 160
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the isolated completion branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/production-completion-20260909
          git merge --no-edit origin/fix/production-completion-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply any pending idempotent integrations
        shell: pwsh
        run: |
          if (Test-Path tools/apply_completion_integration.py) { python tools/apply_completion_integration.py }
          if (Test-Path tools/apply_history_completion.py) { python tools/apply_history_completion.py }
          if (Test-Path tools/apply_verified_history_rows.py) { python tools/apply_verified_history_rows.py }
      - name: Assert required production implementation
        shell: pwsh
        run: |
          $required = @(
            'he_app/domain/periods.py',
            'he_app/fetch/network_policy.py',
            'he_app/runtime/process_jobs.py',
            'he_app/services/cycle_fingerprint.py',
            'he_app/services/verified_history_rows.py',
            'he_app/services/live_validation.py',
            'he_app/services/cycle_duplicate_check.py',
            'he_app/services/hard_runner.py',
            'he_app/storage/cycle_cache.py',
            'he_live_validator.py'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required implementation: $path" }
          }
          if (-not (Select-String -Path he_crawler.py -Pattern 'hard_runner' -Quiet)) {
            throw 'Single-period command is not routed through hard isolation.'
          }
          if (-not (Select-String -Path he_duplicate_checker.py -Pattern 'cycle_duplicate_check' -Quiet)) {
            throw 'Duplicate checker is not cycle-aware.'
          }
      - name: Install dependencies
        run: python -m pip install -e ".[browser,test]"
      - name: Safe lint cleanup, compile and import checks
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m ruff check . --fix
          python -m ruff check .
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -c "import he_crawler, he_multi_period_crawler, he_duplicate_checker, he_live_validator"
          python he_crawler.py --help
          python he_duplicate_checker.py --help
          python he_live_validator.py --help
      - name: Complete offline regression suite
        env:
          HE_NETWORK_POLICY: "off"
        run: python -m pytest -q -m "not browser"
      - name: Resolve Tokyo target period
        id: target
        shell: pwsh
        run: |
          $json = python -c "from datetime import datetime; from zoneinfo import ZoneInfo; import json; n=datetime.now(ZoneInfo('Asia/Tokyo')); print(json.dumps({'cycle':n.year,'period':n.timetuple().tm_yday}))"
          $target = $json | ConvertFrom-Json
          "cycle=$($target.cycle)" >> $env:GITHUB_OUTPUT
          "period=$($target.period)" >> $env:GITHUB_OUTPUT
      - name: Strict live validation of all 125 configured sites
        env:
          HE_NETWORK_POLICY: "strict"
        shell: pwsh
        run: |
          python he_live_validator.py `
            --cycle '${{ steps.target.outputs.cycle }}' `
            --period '${{ steps.target.outputs.period }}' `
            --periods 10 `
            --workers 8 `
            --timeout 20 `
            --hard-timeout 150 `
            --output-dir live-validation-publish
      - name: Assert complete accounting and write permanent status
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('live-validation-publish/live-validation.json').read_text(encoding='utf-8'))
          assert report['site_count'] == 125, report['site_count']
          assert report['attempted_count'] == 125, report['attempted_count']
          assert len(report['results']) == 125
          assert len({item['site_id'] for item in report['results']}) == 125
          assert all(item['attempted'] for item in report['results'])
          categories = ', '.join(f"{key}={value}" for key, value in sorted(report['categories'].items()))
          status = f"""# 生产补全状态

          - GitHub Actions 运行：`{os.environ['GITHUB_RUN_ID']}`
          - 目标周期/期数：`{report['period_key']}`
          - 配置站点：`{report['site_count']}`
          - 已真实尝试：`{report['attempted_count']}`
          - 当期严格验证成功：`{report['current_success_count']}`
          - 具备完整 {report['history_required']} 期历史：`{report['history_complete_count']}`
          - 硬超时：`{report['hard_timeout_count']}`
          - 分类：`{categories}`

          四项工程工作均已落地并通过主分支门禁：125 个站点逐一真实尝试；历史只从当期证据锁定的同一记录、专属表格或逐期独立验证文章提取；判重使用显式周期身份；DNS、TLS、浏览器启动、页面读取和解析均处于可终止子进程硬期限内。

          外部站点不可达、TLS 错误、当期尚未发布或站点本身没有足够历史仍保留真实状态，不得伪造为成功。完整逐站来源、authority、网络证据和历史缺口位于本次 Actions 的 `full-production-live-validation-published` 工件。
          """
          Path('PRODUCTION_COMPLETION_STATUS.md').write_text(status, encoding='utf-8')
          '@ | Set-Content write_publish_status.py -Encoding UTF8
          python write_publish_status.py
          Remove-Item write_publish_status.py
      - name: Upload immutable final evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-production-live-validation-published
          path: live-validation-publish
          if-no-files-found: error
          retention-days: 30
      - name: Remove generated files and all one-shot tooling
        shell: pwsh
        run: |
          $paths = @(
            '.github/workflows/export-source.yml',
            '.github/workflows/baseline-live.yml',
            '.github/workflows/apply-completion-integration.yml',
            '.github/workflows/complete-production-v2.yml',
            '.github/workflows/complete-history-v2.yml',
            '.github/workflows/complete-production-v3.yml',
            '.github/workflows/finalize-production-v4.yml',
            '.github/workflows/finalize-history-v5.yml',
            '.github/workflows/final-publish-production.yml',
            'tools/apply_completion_integration.py',
            'tools/apply_history_completion.py',
            'tools/apply_verified_history_rows.py',
            'live-validation-publish'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
      - name: Final clean-tree verification
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m ruff check .
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -m pytest -q tests/test_period_cycles.py tests/test_cycle_cache.py tests/test_network_policy.py tests/test_process_isolation.py tests/test_completion_coverage.py tests/test_verified_history_rows.py
          git diff --check
      - name: Commit and push verified main
        shell: pwsh
        run: |
          git add --all
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: publish completed production validation, history, cycles and isolation'
          }
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:main
          git push origin HEAD:fix/production-completion-20260909
