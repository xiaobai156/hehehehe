name: Final 252 production check

on:
  push:
    branches:
      - fix/252-failures-20260909
    paths:
      - .github/workflows/final-252-production-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: "strict"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Run read-only live validation
        shell: pwsh
        run: |
          python he_live_validator.py `
            --cycle 2026 `
            --period 252 `
            --periods 10 `
            --workers 8 `
            --browser-workers 3 `
            --timeout 20 `
            --hard-timeout 90 `
            --browser-hard-timeout 130 `
            --output-dir final-live
      - name: Run production single-period entry without cache writes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force final-production | Out-Null
          python he_crawler.py `
            --period 252 `
            --workers 8 `
            --timeout 20 `
            --hard-timeout 90 `
            --browser-hard-timeout 130 `
            --success final-production/252-success.txt `
            --fail final-production/252-fail.txt `
            --no-fingerprint-cache-sync
      - name: Print final comparison
        shell: pwsh
        run: |
          $report = Get-Content final-live/live-validation.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $liveFailed = $report.site_count - $report.current_success_count
          $successCount = 0
          if (Test-Path final-production/252-success.txt) {
            $successCount = @(Get-Content final-production/252-success.txt -Encoding UTF8 | Where-Object { $_ -match '^(?:0[1-9]|1[0-3])合(?:,(?:0[1-9]|1[0-3])合)*\s+' }).Count
          }
          $failCount = 125 - $successCount
          Write-Host "live_success=$($report.current_success_count) live_failed=$liveFailed history_complete=$($report.history_complete_count)"
          Write-Host "production_success=$successCount production_failed=$failCount"
          if ($report.attempted_count -ne 125) { throw "live validation did not attempt all sites" }
      - name: Upload final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-252-production-check
          path: |
            final-live
            final-production
          if-no-files-found: warn
          retention-days: 7
