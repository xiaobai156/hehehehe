name: Complete period-specific history and republish

on:
  push:
    branches:
      - fix/production-completion-20260909
    paths:
      - .github/workflows/complete-history-v2.yml

permissions:
  contents: write

jobs:
  complete-history:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: "strict"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply history integration
        run: python tools/apply_history_completion.py
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Compile, static checks and complete offline suite
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -m ruff check .
          python -m pytest -q -m "not browser"
      - name: Resolve Tokyo target
        id: target
        shell: pwsh
        run: |
          $json = python -c "from datetime import datetime; from zoneinfo import ZoneInfo; import json; n=datetime.now(ZoneInfo('Asia/Tokyo')); print(json.dumps({'cycle':n.year,'period':n.timetuple().tm_yday}))"
          $target = $json | ConvertFrom-Json
          "cycle=$($target.cycle)" >> $env:GITHUB_OUTPUT
          "period=$($target.period)" >> $env:GITHUB_OUTPUT
      - name: Rerun all 125 live sites with per-period history lookup
        shell: pwsh
        run: |
          python he_live_validator.py `
            --cycle '${{ steps.target.outputs.cycle }}' `
            --period '${{ steps.target.outputs.period }}' `
            --periods 10 `
            --workers 8 `
            --timeout 20 `
            --hard-timeout 150 `
            --output-dir live-validation-v2
      - name: Verify complete accounting and create status
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path
          report_path = Path('live-validation-v2/live-validation.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['site_count'] == 125, report['site_count']
          assert report['attempted_count'] == 125, report['attempted_count']
          assert len(report['results']) == 125
          assert len({item['site_id'] for item in report['results']}) == 125
          categories = ', '.join(f"{key}={value}" for key, value in sorted(report['categories'].items()))
          text = f"""# 生产补全状态

          - GitHub Actions 运行：`{os.environ['GITHUB_RUN_ID']}`
          - 目标周期/期数：`{report['period_key']}`
          - 配置站点：`{report['site_count']}`
          - 已真实尝试：`{report['attempted_count']}`
          - 当期严格验证成功：`{report['current_success_count']}`
          - 具备完整 {report['history_required']} 期历史：`{report['history_complete_count']}`
          - 硬超时：`{report['hard_timeout_count']}`
          - 分类：`{categories}`

          本轮已对动态单文章站按窗口逐期寻找并独立验证历史文章。外部不可达、证书错误、尚未发布或网站本身没有足够历史时，仍保留为真实失败/历史不足；详细逐站证据位于该 Actions 运行的 `full-production-live-validation-v2` 工件。
          """
          Path('PRODUCTION_COMPLETION_STATUS.md').write_text(text, encoding='utf-8')
          '@ | Set-Content write_status_v2.py -Encoding UTF8
          python write_status_v2.py
          Remove-Item write_status_v2.py
      - name: Upload complete live evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-production-live-validation-v2
          path: live-validation-v2
          if-no-files-found: error
          retention-days: 30
      - name: Remove one-shot patch tooling and generated report
        shell: pwsh
        run: |
          $paths = @(
            '.github/workflows/complete-history-v2.yml',
            'tools/apply_history_completion.py',
            'live-validation-v2'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
      - name: Final focused verification
        env:
          HE_NETWORK_POLICY: "off"
        run: |
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -m pytest -q tests/test_period_cycles.py tests/test_cycle_cache.py tests/test_network_policy.py tests/test_process_isolation.py tests/test_completion_coverage.py
          git diff --check
      - name: Commit and fast-forward branch and main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: complete per-period verified history collection'
          }
          git push origin HEAD:fix/production-completion-20260909
          git push origin HEAD:main
