name: Full production live validation

on:
  push:
    branches:
      - fix/production-completion-20260909
    paths:
      - .github/workflows/live-production-validation.yml
  workflow_dispatch:
    inputs:
      period:
        description: Target period number; blank uses Tokyo day-of-year
        required: false
        type: string
      cycle:
        description: Explicit cycle; blank uses Tokyo year
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-all-sites:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: "strict"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Confirm completed production entry points
        shell: pwsh
        run: |
          if (-not (Select-String -Path he_crawler.py -Pattern 'hard_runner' -Quiet)) {
            throw 'Single-period production entry is not hard-isolated.'
          }
          if (-not (Select-String -Path he_duplicate_checker.py -Pattern 'cycle_duplicate_check' -Quiet)) {
            throw 'Duplicate checker is not cycle-aware.'
          }
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Compile and run offline completion tests
        run: |
          python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
          python -m pytest -q tests/test_period_cycles.py tests/test_cycle_cache.py tests/test_network_policy.py tests/test_process_isolation.py tests/test_completion_coverage.py
      - name: Resolve target cycle and period
        id: target
        shell: pwsh
        run: |
          $period = '${{ inputs.period }}'
          $cycle = '${{ inputs.cycle }}'
          if ([string]::IsNullOrWhiteSpace($period) -or [string]::IsNullOrWhiteSpace($cycle)) {
            $json = python -c "from datetime import datetime; from zoneinfo import ZoneInfo; import json; n=datetime.now(ZoneInfo('Asia/Tokyo')); print(json.dumps({'cycle':n.year,'period':n.timetuple().tm_yday}))"
            $target = $json | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($period)) { $period = [string]$target.period }
            if ([string]::IsNullOrWhiteSpace($cycle)) { $cycle = [string]$target.cycle }
          }
          "period=$period" >> $env:GITHUB_OUTPUT
          "cycle=$cycle" >> $env:GITHUB_OUTPUT
          Write-Host "Validating cycle=$cycle period=$period"
      - name: Validate every configured live site without production writes
        shell: pwsh
        run: |
          python he_live_validator.py `
            --cycle '${{ steps.target.outputs.cycle }}' `
            --period '${{ steps.target.outputs.period }}' `
            --periods 10 `
            --workers 8 `
            --timeout 20 `
            --hard-timeout 90 `
            --output-dir live-validation
      - name: Verify complete accounting
        shell: pwsh
        run: |
          $report = Get-Content live-validation/live-validation.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.site_count -ne 125) {
            throw "Expected 125 configured sites, got $($report.site_count)."
          }
          if ($report.attempted_count -ne $report.site_count) {
            throw "Not every site was attempted: $($report.attempted_count)/$($report.site_count)."
          }
          @(
            "cycle=$($report.cycle)",
            "period=$($report.period)",
            "sites=$($report.site_count)",
            "attempted=$($report.attempted_count)",
            "current_success=$($report.current_success_count)",
            "history_complete=$($report.history_complete_count)",
            "hard_timeouts=$($report.hard_timeout_count)"
          ) | Set-Content live-validation/summary.txt -Encoding UTF8
          Get-Content live-validation/summary.txt
      - name: Upload immutable live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-production-live-validation
          path: live-validation
          if-no-files-found: error
          retention-days: 30
