name: Debug 252 static failures

on:
  push:
    branches:
      - debug/252-static-failures-20260909
    paths:
      - .github/workflows/debug-252-static.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: "strict"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Inspect failed static sites
        run: python tools/debug_252_static_failures.py
      - name: Show summary
        shell: pwsh
        run: Get-Content debug-252-static/summary.json -Raw -Encoding UTF8
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-252-static
          path: debug-252-static
          if-no-files-found: warn
          retention-days: 3
