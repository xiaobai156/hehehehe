name: Apply verified repair on isolated branch
on:
  push:
    branches: ['fix/audit-repair-20260909']
    paths: ['.github/workflows/apply-repair.yml', '.repair/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'xiaobai156/hehehehe' && github.ref == 'refs/heads/fix/audit-repair-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source ancestry and exact payload hashes
        run: |
          git merge-base --is-ancestor a7bf9317712272aeab2f924103e5e1d74e6b22e0 HEAD
          python .repair/apply.py
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile and lint
        run: |
          python -m compileall -q he_app he_crawler.py he_duplicate_checker.py he_multi_period_crawler.py
          python -m ruff check he_app tests he_crawler.py he_duplicate_checker.py he_multi_period_crawler.py
          git diff --cached --check
      - name: Offline regressions
        run: python -m pytest -q -m 'not browser' --junitxml=test-results.xml
      - name: Verify tested source and preserve production data
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          for source in ['.repair/expected.json', '.repair/frozen.json']:
              for name, expected in json.loads(Path(source).read_text()).items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Commit only verified staged sources to repair branch
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore entrypoints and enforce bounded sources, reports and cache contracts'
          git push origin HEAD:refs/heads/fix/audit-repair-20260909
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-application-tests
          path: test-results.xml
          retention-days: 3
