name: Offline tests

on:
  push:
    branches: [main, 'fix/audit-repair-20260909']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4 pytest
      - name: Snapshot tracked sources for reproducible verification
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - name: Compile
        run: python -m compileall -q he_app he_crawler.py he_duplicate_checker.py he_multi_period_crawler.py
      - name: Tests
        run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-verification
          path: |
            source-snapshot.zip
            test-results.xml
          retention-days: 3
