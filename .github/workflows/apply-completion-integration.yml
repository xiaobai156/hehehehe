name: Apply production completion integration

on:
  push:
    branches:
      - fix/production-completion-20260909
    paths:
      - .github/workflows/apply-completion-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply integration patch
        run: python tools/apply_completion_integration.py
      - name: Install
        run: python -m pip install -e '.[browser,test]'
      - name: Compile
        run: python -m compileall -q he_app he_crawler.py he_multi_period_crawler.py he_duplicate_checker.py he_live_validator.py
      - name: Import production entries
        run: |
          python -c "import he_crawler"
          python -c "import he_multi_period_crawler"
          python -c "import he_duplicate_checker"
          python -c "import he_live_validator"
      - name: Static checks
        run: python -m ruff check .
      - name: Offline regressions
        run: python -m pytest -q -m 'not browser'
      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'feat: complete cross-cycle validation and hard-isolated production paths'
          git push origin HEAD:fix/production-completion-20260909
