name: Diagnose remaining thirty strict edge failures

on:
  push:
    branches:
      - fix-remaining-thirty-252-20260910

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose-${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        name:
          - 电子排版
          - 朝三暮四
          - 达罗环宇
          - 无適无莫
          - 阳光明媚
          - 错过中原
          - 踏雪无痕网
          - 伤心人家
          - 残丝断魂
          - 作舍道旁
          - 稳打稳中
          - 通天
          - 春风化雨
          - 兴高采烈
          - 叹为观止
          - 追根查源
          - 嫦娥奔月
          - 东益散人
          - 没名字一
          - 丰墙硗下
          - 怒气冲冲
          - 挂牌
          - 没名字五
          - 和风细雨
          - 新人旧梦
          - 流浪高手
          - 雷锋第一版
          - 没名字二
          - 号令如山
          - 亡羊补牢
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HE_NETWORK_POLICY: strict
      HE_MAX_RESPONSE_BYTES: '8388608'
      TARGET_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Build one-site config
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          name = os.environ['TARGET_NAME']
          data = json.loads(Path('sites.json').read_text(encoding='utf-8'))
          subset = [item for item in data if item['name'] == name]
          if len(subset) != 1:
              raise SystemExit(f'expected one site for {name}, got {len(subset)}')
          Path('one-site.json').write_text(json.dumps(subset, ensure_ascii=False, indent=2), encoding='utf-8')
          item=subset[0]
          print(f"TARGET {item['name']} id={item['id']} pick={item['pick']} browser={item['browser']} url={item['url']}")
          '@ | python -
      - name: Production and raw boundary diagnostic
        shell: pwsh
        run: |
          python he_crawler.py `
            --period 252 `
            --sites one-site.json `
            --workers 1 `
            --timeout 30 `
            --hard-timeout 120 `
            --browser-hard-timeout 160 `
            --success one-success.txt `
            --fail one-fail.txt `
            --no-fingerprint-cache-sync
          Write-Host '===== CURRENT RESULT ====='
          if (Test-Path one-success.txt) { Get-Content one-success.txt -Encoding UTF8 }
          if (Test-Path one-fail.txt) { Get-Content one-fail.txt -Encoding UTF8 }
          @'
          import re
          from pathlib import Path
          from bs4 import BeautifulSoup
          from he_app.config.sites import load_sites
          from he_app.fetch.http import create_session, build_host_locks
          from he_app.fetch.browser import BrowserClient, close_browser_safely
          from he_app.services.adaptive_fetch import collect_http_documents, collect_special_documents
          from he_app.services.browser_policy import runtime_requires_browser, runtime_click_first
          from he_app.services.document_sources import requires_browser
          from he_app.services.single_period import evaluate_site_period

          site = load_sites(Path('one-site.json'))[0]
          host_locks = build_host_locks([site])
          docs=[]
          browser=None
          with create_session(host_locks) as session:
              try:
                  special = collect_special_documents(session, site, 30, 252)
                  if special is not None:
                      docs=list(special)
                      print(f'SPECIAL_DOCS={len(docs)}')
              except Exception as exc:
                  print(f'SPECIAL_ERR={type(exc).__name__}: {exc}')
              if not docs:
                  try:
                      docs=list(collect_http_documents(session, site, 30))
                      print(f'HTTP_DOCS={len(docs)}')
                  except Exception as exc:
                      print(f'HTTP_ERR={type(exc).__name__}: {exc}')
              if runtime_requires_browser(site, requires_browser):
                  try:
                      browser=BrowserClient(headless=True)
                      browser.start()
                      bdocs=browser.get_documents(site.url, 252, runtime_click_first(site), 30)
                      if bdocs:
                          docs=list(bdocs)
                          print(f'BROWSER_DOCS={len(docs)}')
                  except Exception as exc:
                      print(f'BROWSER_ERR={type(exc).__name__}: {exc}')
                  finally:
                      if browser is not None:
                          close_browser_safely(browser)

          for period in (252,253):
              try:
                  print(f'EVAL_{period}={evaluate_site_period(site, period, docs) if docs else (None,"no docs",[],None)}')
              except Exception as exc:
                  print(f'EVAL_{period}_ERR={type(exc).__name__}: {exc}')

          def compact_lines(doc):
              soup=BeautifulSoup(str(doc),'html.parser')
              text=soup.get_text('\n',strip=True) or str(doc)
              return [re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]

          print('===== RAW 252/253 EVIDENCE =====')
          for di,doc in enumerate(docs[:4]):
              lines=compact_lines(doc)
              print(f'DOC {di} source={getattr(doc,"source_url","")} kind={getattr(doc,"fetch_kind","")} lines={len(lines)}')
              indexes=[i for i,line in enumerate(lines) if re.search(r'(?<!\d)(?:252|253)\s*期',line)]
              seen=set()
              for i in indexes[:20]:
                  chunk=' || '.join(lines[max(0,i-2):min(len(lines),i+3)])[:1600]
                  if chunk in seen: continue
                  seen.add(chunk)
                  print('EX:',chunk)
              strict=[]
              for i,line in enumerate(lines):
                  if re.search(r'(?:绝|絕)\s*(?:杀|殺)\s*一\s*合|(?:杀|殺)\s*一\s*合|(?:杀|殺)\s*合',line):
                      strict.append((i,line[:500]))
              if strict:
                  print('STRICT_FIRST:',strict[:4])
                  print('STRICT_LAST:',strict[-4:])
          '@ | python -
