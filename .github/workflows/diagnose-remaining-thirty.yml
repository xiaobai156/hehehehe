name: Diagnose remaining thirty strict edge failures

on:
  push:
    branches:
      - fix-remaining-thirty-252-20260910

permissions:
  contents: read

jobs:
  diagnose:
    name: browser-${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        name: [电子排版, 朝三暮四, 达罗环宇, 无適无莫, 阳光明媚, 错过中原, 踏雪无痕网, 伤心人家, 残丝断魂, 作舍道旁, 稳打稳中, 通天, 春风化雨, 兴高采烈, 叹为观止, 追根查源, 嫦娥奔月, 东益散人, 没名字一, 丰墙硗下, 怒气冲冲, 挂牌, 没名字五, 和风细雨, 新人旧梦, 流浪高手, 雷锋第一版, 没名字二, 号令如山, 亡羊补牢]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HE_NETWORK_POLICY: strict
      HE_MAX_RESPONSE_BYTES: '8388608'
      TARGET_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Force real browser page and summarize
        shell: pwsh
        run: |
          @'
          import json, os, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          from he_app.config.sites import load_sites
          from he_app.fetch.http import create_session, build_host_locks
          from he_app.fetch.browser import BrowserClient, close_browser_safely
          from he_app.services.adaptive_fetch import collect_special_documents
          from he_app.services.browser_policy import runtime_click_first
          from he_app.services.single_period import evaluate_site_period

          name=os.environ['TARGET_NAME']
          data=json.loads(Path('sites.json').read_text(encoding='utf-8'))
          subset=[item for item in data if item['name']==name]
          if len(subset)!=1: raise SystemExit(f'expected one site for {name}, got {len(subset)}')
          Path('one-site.json').write_text(json.dumps(subset,ensure_ascii=False,indent=2),encoding='utf-8')
          site=load_sites(Path('one-site.json'))[0]
          out=[f'SITE={site.name}\tID={site.site_id}\tPICK={site.pick}\tURL={site.url}']

          # If a special collector discovers the current article URL, render that exact URL.
          target_url=site.url
          host_locks=build_host_locks([site])
          with create_session(host_locks) as session:
              try:
                  special=collect_special_documents(session,site,30,252)
                  if special:
                      sd=list(special)
                      if sd and getattr(sd[0],'source_url',None):
                          target_url=sd[0].source_url
                          out.append(f'SPECIAL_TARGET={target_url}')
              except Exception as exc:
                  out.append(f'SPECIAL_DISCOVERY_ERR={type(exc).__name__}:{exc}')

          docs=[]; browser=None
          try:
              browser=BrowserClient(headless=True); browser.start()
              # Discovered detail pages are already exact; only use click_first on the configured landing URL.
              click_first=runtime_click_first(site) if target_url==site.url else False
              docs=list(browser.get_documents(target_url,252,click_first,45) or [])
              out.append(f'BROWSER_DOCS={len(docs)} TARGET={target_url}')
          except Exception as exc:
              out.append(f'BROWSER_ERR={type(exc).__name__}:{exc}')
          finally:
              if browser is not None: close_browser_safely(browser)

          for period in (252,253):
              try: out.append(f'EVAL_{period}={evaluate_site_period(site,period,docs) if docs else (None,"no docs",[],None)}')
              except Exception as exc: out.append(f'EVAL_{period}_ERR={type(exc).__name__}:{exc}')

          def lines_of(doc):
              soup=BeautifulSoup(str(doc),'html.parser')
              text=soup.get_text('\n',strip=True) or str(doc)
              return [re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]
          evidence=[]
          for di,doc in enumerate(docs[:3]):
              lines=lines_of(doc)
              out.append(f'DOC{di}_LINES={len(lines)} SOURCE={getattr(doc,"source_url","")}')
              for i,line in enumerate(lines):
                  if re.search(r'(?<!\d)(?:252|253)\s*期',line):
                      chunk=' || '.join(lines[max(0,i-2):min(len(lines),i+3)])[:1200]
                      if chunk not in evidence: evidence.append(chunk)
              strict=[line[:600] for line in lines if re.search(r'(?:绝|絕)\s*(?:杀|殺)\s*一\s*合|(?:杀|殺)\s*一\s*合|(?:杀|殺)\s*合',line)]
              if strict:
                  out.append(f'DOC{di}_STRICT_FIRST={strict[:3]}')
                  out.append(f'DOC{di}_STRICT_LAST={strict[-3:]}')
          for idx,chunk in enumerate(evidence[:15],1): out.append(f'EVIDENCE{idx}={chunk}')
          if not evidence: out.append('NO_252_253_BROWSER_EVIDENCE')
          Path('summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-${{ matrix.name }}
          path: summary.txt
          if-no-files-found: warn
          retention-days: 3

  aggregate:
    runs-on: ubuntu-latest
    needs: diagnose
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: summaries
          merge-multiple: false
      - name: Print compact evidence
        shell: bash
        run: |
          find summaries -name summary.txt -print0 | sort -z | while IFS= read -r -d '' f; do
            echo '================================================================================'
            cat "$f"
          done
