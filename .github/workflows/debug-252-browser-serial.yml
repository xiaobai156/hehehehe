name: Debug 252 browser serial

on:
  push:
    branches:
      - debug/252-browser-serial-20260909
    paths:
      - .github/workflows/debug-252-browser-serial.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HE_NETWORK_POLICY: "strict"
      HE_MAX_RESPONSE_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[browser,test]"
      - name: Run representative browser sites serially
        shell: pwsh
        run: |
          python he_live_validator.py `
            --cycle 2026 `
            --period 252 `
            --periods 10 `
            --workers 1 `
            --browser-workers 1 `
            --timeout 20 `
            --hard-timeout 120 `
            --sites debug_252_browser_subset.json `
            --output-dir debug-252-browser
      - name: Print report
        shell: pwsh
        run: |
          $report = Get-Content debug-252-browser/live-validation.json -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "success=$($report.current_success_count)/$($report.site_count) hard_timeouts=$($report.hard_timeout_count)"
          foreach ($item in $report.results) {
            Write-Host "$($item.site_id) current=$($item.current_ok) elapsed=$([math]::Round($item.elapsed,2)) category=$($item.error_category) error=$($item.error)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-252-browser-serial
          path: debug-252-browser
          if-no-files-found: warn
          retention-days: 3
